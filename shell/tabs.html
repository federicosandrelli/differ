<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Pull requests</title>
__THEME__
<style>
html, body { height: 100%; }
body { font-size: 13px; display: flex; flex-direction: column; overflow: hidden; }
#tabs { flex: none; display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 8px; background: var(--bg-panel); border-bottom: 1px solid var(--border); overflow: hidden; user-select: none; -webkit-user-select: none; }
html.app #tabs { height: 40px; padding-left: 84px; }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: var(--radius); color: var(--text-secondary); flex: 0 1 auto; min-width: 48px; max-width: 260px; cursor: default; }
.tab:hover { background: var(--bg-hover); }
.tab.on { background: var(--bg-inset); color: var(--text); box-shadow: 0 0 0 1px var(--border); }
.tab.home { flex: none; padding: 0 8px; min-width: 0; }
.tab.home svg { display: block; }
.tab .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
/* The count sits on the inset of the open tab, so it takes the canvas. */
.tab .count { flex: none; background: var(--bg-canvas); border: 1px solid var(--border); }
.tab.warn .label { color: var(--del-fg); }
.tab .close { flex: none; width: 16px; height: 16px; border: 0; border-radius: var(--radius-sm); padding: 0; background: none; color: var(--text-muted); font: 15px/16px var(--sans); visibility: hidden; }
.tab:hover .close, .tab.on .close { visibility: visible; }
.tab .close:hover { background: var(--bg-hover-strong); color: var(--text); }
#panes { flex: 1; position: relative; min-height: 0; }
#panes iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg-canvas); visibility: hidden; }
#panes iframe.on { visibility: visible; }
#update { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(680px, calc(100vw - 40px)); display: flex; align-items: center; gap: 48px; padding: 10px 12px 10px 16px; }
#update[hidden] { display: none; }
#update .text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
#update .title { font-weight: 600; }
#update .sub { color: var(--text-secondary); }
#update .actions { flex: none; display: flex; gap: 8px; }
#gear { position: fixed; left: 8px; bottom: 8px; padding: 1px 6px; }
#gear svg { display: block; }
/* The dialog fills the window and dims it itself: before 2024, browsers gave ::backdrop none of the colour tokens. */
#settings { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--backdrop); }
#settings[open] { display: flex; align-items: center; justify-content: center; }
#settings::backdrop { background: transparent; }
#settings .box { display: flex; flex-direction: column; width: min(760px, calc(100vw - 48px)); max-height: 85vh; color: var(--text); }
#settings .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
#settings .top h1 { font-size: 17px; margin: 0; }
#settings .body { overflow-y: auto; padding: 4px 24px 24px; font-size: 14px; line-height: 1.55; }
#settings h2 { font-size: 15px; margin: 22px 0 8px; }
#settings h3 { font-size: 14px; margin: 18px 0 6px; }
#settings p { margin: 8px 0; }
#settings ul { margin: 8px 0; padding-left: 20px; } #settings li { margin: 5px 0; }
#settings .editors { list-style: none; padding: 0; } #settings .editors .hint { margin-left: 8px; }
#settings code { font: 12.5px var(--mono); background: var(--bg-inset); padding: 0 4px; border-radius: var(--radius-sm); }
#settings table { border-collapse: collapse; font-size: 13.5px; }
#settings .keys { width: 100%; }
#settings .keys td, #settings .cache td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
#settings .keys td:first-child { white-space: nowrap; width: 1%; padding-right: 16px; }
#settings .patterns { margin-top: 4px; } #settings .patterns td { padding: 2px 16px 2px 0; }
#settings .cache { margin-top: 8px; } #settings .cache td:last-child { text-align: right; font-family: var(--mono); }
/* The live example of an inline fold draws a few rows as the diff table does, in the diff's own tokens. */
#settings .example { width: 100%; margin: 10px 0; font: 12px/1.7 var(--mono); border: 1px solid var(--border); border-radius: var(--radius); }
#settings .example td { padding: 0 8px; white-space: pre; }
#settings .example td.n { width: 1%; text-align: right; color: var(--text-muted); user-select: none; }
#settings .example tr.add td { background: var(--add-bg); } #settings .example tr.add td.n { background: var(--add-num); color: var(--add-fg); }
#settings .about { margin-top: 28px; }
</style>
</head><body><div id="tabs" data-tauri-drag-region></div><div id="panes"></div>
<button id="gear" class="ghost" title="Settings (⌘,)" aria-label="Settings"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<dialog id="settings"><div class="box card"><div class="top"><h1>Settings</h1><button class="ghost close" aria-label="Close">✕</button></div>
<div class="body"><h2>Theme</h2><span class="seg"><button data-theme="light">Light</button><button data-theme="sepia">Sepia</button><button data-theme="dark">Dark</button></span><div class="state"></div></div></div></dialog>
<div id="update" class="card" role="status" hidden><div class="text"><span class="title"></span><span class="sub"></span></div><div class="actions"><button class="later">Later</button><button class="primary act"></button></div></div>
