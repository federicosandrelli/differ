<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>__TITLE__</title>
__THEME__
<style>
main { max-width: 920px; margin: 0 auto; padding: 32px 24px 64px; }
h1 { font-size: 20px; margin: 0 0 4px; }
header.start { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px 48px; margin: 0 0 24px; }
h1.start { flex: none; margin: 0; line-height: 1; }
h1.start .beg { display: block; font-size: 24px; font-weight: 300; color: var(--text-secondary); margin-bottom: 2px; }
h1.start .differ { font-size: 64px; font-weight: 600; letter-spacing: -0.02em; color: var(--accent); }
h1 + .log { margin-top: 20px; }
.banner { margin: 12px 0 16px; }
header.start form { flex: 1 1 420px; display: flex; flex-direction: column; gap: 6px; padding-bottom: 6px; }
header.start .row { display: flex; gap: 8px; }
input { flex: 1; }
main:has(#board) { max-width: 1320px; }
.group > h2 { display: flex; align-items: center; gap: 8px; font-size: 20px; margin: 32px 0 8px; }
/* A group without a title is set apart from the one above by space alone. */
.group:not(:has(> h2)) { margin-top: 32px; }
.group:not(:has(> h2)) + .group:not(:has(> h2)) { margin-top: 56px; }
/* A row of --n columns: side by side in equal widths while each has --column-min, otherwise all stacked. Below the
   threshold the flex basis turns huge and each column takes a line; above it, the basis is 0 and they share it. */
.columns { --column-min: 400px; --gap: 20px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--gap); }
.columns > .column { flex: 1 1 calc((var(--n) * var(--column-min) + (var(--n) - 1) * var(--gap) - 100%) * 999); }
.column, .sub { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sub { max-height: 50vh; overflow-y: auto; }
.column h3, .folded h3 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
/* A folded column opens under the row, from a summary that holds the column's chevron and its head. */
.folded { margin-top: 16px; }
.folded > summary { display: flex; align-items: center; gap: 4px; list-style: none; cursor: pointer; color: var(--text-secondary); }
.folded > summary::-webkit-details-marker { display: none; }
.folded > summary:hover, .folded > summary:hover h3 { color: var(--accent); }
.folded > .column { margin-top: 8px; }
.none { opacity: var(--dim); }
.pr { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; }
/* A card's two lines: the title with the age on the right, then the repository with the reasons on the right. The
   reasons drop to a line of their own, still on the right, when the repository leaves them no room. */
.pr .line { display: flex; align-items: center; gap: 6px 12px; min-width: 0; }
.pr .line:first-child { align-items: baseline; }
.pr .line:last-child { flex-wrap: wrap; }
.pr .t { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.pr .m { flex: 1 1 auto; display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.pr .m .by, .pr .m .ref { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pr .m .ref { flex: 0 100 auto; font-family: var(--mono); }
.pr .m .split { flex: none; }
.pr .links { flex: none; display: flex; align-items: center; gap: 6px; }
.pr .links a { display: flex; }
.pr .links .linear { color: var(--linear-fg); }
.pr .links .reason-icon { width: 14px; height: 14px; }
.pr .age { flex: none; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.pr .reasons { flex: 0 1 auto; min-width: 0; margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px 6px; }
/* A reason pill sits above the cover, so its title shows; it lights the card, and a click on it opens the card. */
.card:has(.cover) .reason { position: relative; cursor: pointer; }
.card:has(.reason:hover) { background: var(--bg-hover); }
.card:has(.cover:hover) .reason, .card:has(.reason:hover) .reason { background: var(--bg-canvas); }
.quiet .pr { gap: 2px; padding: 7px 12px; }
.quiet .pr .t { font-weight: 400; color: var(--text-secondary); -webkit-line-clamp: 1; }
.quiet .pr .m, .quiet .pr .age { font-size: 11px; }
.list { max-height: 50vh; overflow: hidden auto; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 8px 14px; border-top: 1px solid var(--border); color: var(--text); }
.item:first-child { border-top: 0; } .item:hover { background: var(--bg-panel); text-decoration: none; }
.item .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t .pr-icon { margin-right: 6px; }
.item .m { grid-column: 1; display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--text-muted); font-size: 12px; }
.item .m .ref { font-family: var(--mono); }
.item .w { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.empty { color: var(--text-muted); padding: 12px 14px; }
footer.start { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 24px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); }
footer.start .login { color: var(--text-secondary); }
html:not(.framed) #board [data-settings] { display: none; }
.repos { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.repos > .hint { margin-right: 6px; }
/* The repository strip, with the update notice at the right end of its row, or under it on the right when the row
   has no room for both. */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.strip > .repos { flex: 1 1 auto; min-width: 0; }
.strip > .updated { margin-left: auto; }
.strip > .updated > .notice { justify-content: flex-end; text-align: right; }
div.log { font: 13px/1.7 var(--mono); color: var(--text-secondary); background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 16px; white-space: pre-wrap; }
div.log b { color: var(--text); font-weight: 500; }
html.app body { padding-top: 28px; }
</style>
</head><body><script>__FRAME__</script><main>__BODY__</main></body></html>
