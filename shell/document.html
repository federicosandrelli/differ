<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>__TITLE__</title>
__THEME__
<style>
main { max-width: 920px; margin: 0 auto; padding: 32px 24px 64px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h1.start { margin: 0 0 20px; line-height: 1; }
h1.start .beg { display: block; font-size: 24px; font-weight: 300; color: var(--text-secondary); margin-bottom: 2px; }
h1.start .differ { font-size: 64px; font-weight: 600; letter-spacing: -0.02em; color: var(--accent); }
h1 + .log { margin-top: 20px; }
.banner { margin: 12px 0 16px; }
form { display: flex; gap: 8px; margin: 0 0 20px; }
input { flex: 1; }
main:has(#board) { max-width: 1320px; }
.group > h2 { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 28px 0 12px; }
.group.opened > h2 { margin-bottom: 8px; }
.columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 20px; align-items: start; }
.column, .sub { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.column h3, .sub h4 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.sub h4 { margin-top: 6px; font-size: 12px; font-weight: 500; color: var(--text-muted); }
.sub > [hidden] { display: none; }
.sub > .more { align-self: flex-start; }
.none { opacity: var(--dim); }
.pr { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; }
.pr .t { font-size: 13px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.pr .m { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.pr .m .ref { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pr .why { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
.quiet .pr { gap: 2px; padding: 7px 12px; }
.quiet .pr .t { font-weight: 400; color: var(--text-secondary); -webkit-line-clamp: 1; }
.quiet .pr .m { font-size: 11px; }
.list { overflow: hidden; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 8px 14px; border-top: 1px solid var(--border); color: var(--text); }
.item:first-child { border-top: 0; } .item:hover { background: var(--bg-panel); text-decoration: none; }
.item .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t .pr-icon { margin-right: 6px; }
.item .m { grid-column: 1; display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--text-muted); font-size: 12px; }
.item .m .ref { font-family: var(--mono); }
.item .w { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.why { color: var(--text-secondary); }
.why.bad { color: var(--del-fg); } .why.warn { color: var(--mod-fg); } .why.ok { color: var(--add-fg); } .why.accent { color: var(--accent); }
.empty { color: var(--text-muted); padding: 12px 14px; }
.log { font: 13px/1.7 var(--mono); color: var(--text-secondary); background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 16px; white-space: pre-wrap; }
.log b { color: var(--text); font-weight: 500; }
html.app body { padding-top: 28px; }
</style>
</head><body><script>__FRAME__</script><main>__BODY__</main></body></html>
