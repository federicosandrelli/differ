<h1 class="start"><span class="beg">I beg to</span><span class="differ">differ</span></h1>
__BANNER__
<form action="/open"><input name="pr" class="big" placeholder="https://github.com/owner/repo/pull/123 or owner/repo#123" autofocus><button class="primary big">Open</button></form>
<div id="board">__BOARD__</div>
<script>
// The sections the reader closed, by key, saved as dr:closed so they stay closed across reloads and relaunches.
const board = document.getElementById('board');
const closedKeys = () => { try { return new Set(JSON.parse(localStorage.getItem('dr:closed')) || []); } catch { return new Set(); } };
const showClosed = () => {
  const closed = closedKeys();
  for (const sub of board.querySelectorAll('.sub')) {
    const open = !closed.has(sub.dataset.key), chev = sub.querySelector('.chev');
    sub.classList.toggle('closed', !open);
    chev.classList.toggle('open', open);
    chev.setAttribute('aria-expanded', String(open));
  }
};
board.addEventListener('click', (e) => {
  const chev = e.target.closest('.sub .chev');
  if (!chev) return;
  const closed = closedKeys(), key = chev.closest('.sub').dataset.key;
  if (!closed.delete(key)) closed.add(key);
  try { localStorage.setItem('dr:closed', JSON.stringify([...closed])); } catch {}
  showClosed();
});
showClosed();
let loading = null;
const loadBoard = () => {
  if (loading) loading.abort();
  loading = new AbortController();
  fetch('/board', { signal: loading.signal }).then(r => r.ok ? r.text() : Promise.reject()).then(h => { board.innerHTML = h; showClosed(); }).catch(() => {});
};
loadBoard();
document.addEventListener('tab-shown', loadBoard);
// Focus selects the whole field, so a pasted link replaces the old one. A click that focuses the field would put the
// caret where it lands on mouseup, so that one mouseup keeps the selection.
const pr = document.querySelector('input[name=pr]');
let clickFocus = false;
pr.addEventListener('mousedown', () => { clickFocus = document.activeElement !== pr; });
pr.addEventListener('mouseup', (e) => { if (clickFocus) e.preventDefault(); clickFocus = false; });
pr.addEventListener('focus', () => pr.select());
// The browser reads the field when the submit event ends, so the field empties after that.
pr.form.addEventListener('submit', () => setTimeout(() => { pr.value = ''; }));
</script>
