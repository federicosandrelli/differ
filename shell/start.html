<header class="start"><h1 class="start"><span class="beg">I beg to</span><span class="differ">differ</span></h1>
<form action="/open"><label class="hint" for="pr">Open a pull request</label><div class="row"><input id="pr" name="pr" class="big" placeholder="https://github.com/owner/repo/pull/123 or owner/repo#123" autofocus><button class="primary big">Open</button></div></form></header>
__BANNER__
<div id="board">__BOARD__</div>
<script>
// The folded columns the reader opened, by key, and where the reader scrolled each list, so a redraw of the board
// keeps them. A list scrolls only once its folded column is open.
const board = document.getElementById('board');
const openedColumns = new Set();
const lists = () => board.querySelectorAll('.sub, .list');
const listKey = (list) => list.dataset.key ?? 'opened';
// A list marks the edges with cards past them, which fade. A list that scrolls has a button under it, under its card
// when it sits in one, with the count of the cards below its bottom edge, disabled once none are. The button pages
// the list by the height between the fades, so each card passes clear of both. A button that hides or goes takes
// the focus with it, so the focus moves to the last card's link.
const fade = (list, edge) => parseFloat(getComputedStyle(list).getPropertyValue(`--fade-${edge}`));
const page = (list) => {
  const step = Math.max(list.clientHeight - fade(list, 'top') - fade(list, 'bottom'), list.clientHeight / 2);
  list.scrollBy({ top: step, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
};
const handOff = (list, more) => {
  if (document.activeElement !== more) return;
  const last = list.lastElementChild;
  (last.matches('a') ? last : last.querySelector('a'))?.focus({ preventScroll: true });
};
const mark = (list) => {
  const edge = list.getBoundingClientRect().top + list.clientTop + list.clientHeight;
  const below = [...list.children].filter(card => card.getBoundingClientRect().bottom > edge + 1).length;
  list.toggleAttribute('data-above', list.scrollTop > 1);
  list.toggleAttribute('data-below', below > 0);
  const key = listKey(list);
  let more = board.querySelector(`.more[data-list="${CSS.escape(key)}"]`);
  if (list.scrollHeight <= list.clientHeight) {
    if (more) { handOff(list, more); more.remove(); }
    return;
  }
  if (!more) {
    more = Object.assign(document.createElement('button'), { className: 'ghost more' });
    more.dataset.list = key;
    more.addEventListener('click', () => page(list));
    (list.parentElement.closest('.card') ?? list).after(more);
  }
  const text = `${below} more ↓`;
  if (more.textContent !== text) {
    more.textContent = text;
    more.setAttribute('aria-label', `${below} more in ${list.dataset.label}`);
  }
  if (!below) handOff(list, more);
  more.disabled = !below;
};
const markAll = () => lists().forEach(mark);
const redraw = (h) => {
  const scrolled = new Map([...lists()].map(list => [listKey(list), list.scrollTop]));
  board.innerHTML = h;
  for (const folded of board.querySelectorAll('.folded')) folded.open = openedColumns.has(folded.dataset.key);
  for (const list of lists()) list.scrollTop = scrolled.get(listKey(list)) ?? 0;
  markAll();
};
// Toggle and scroll events do not bubble, so the board hears them in the capture phase.
board.addEventListener('toggle', (e) => {
  const folded = e.target.closest('.folded');
  if (!folded) return;
  if (folded.open) openedColumns.add(folded.dataset.key); else openedColumns.delete(folded.dataset.key);
}, true);
board.addEventListener('scroll', (e) => { if (e.target.matches?.('.sub, .list')) mark(e.target); }, true);
// The browser scrolls a focused card only until some of it shows, so the card may sit in a fade. Scrolling to the
// nearest edge honours the list's scroll padding, which keeps the card clear of both fades.
board.addEventListener('focusin', (e) => {
  const list = e.target.closest('.sub, .list');
  if (list) [...list.children].find(card => card.contains(e.target))?.scrollIntoView({ block: 'nearest' });
});
// The board resizes with the window, when a folded column opens, and when a page scrollbar comes or goes, which can
// wrap a card's title. Marking adds and removes buttons, which resizes the board again, so it waits for the next
// frame rather than resize the board inside the observer.
new ResizeObserver(() => requestAnimationFrame(markAll)).observe(board);
markAll();
// The repositories the reader turned on in the strip above the groups. The server draws the board with their rows
// only, and presses their toggles; a repository the reader no longer follows has no toggle, so it drops out.
const REPOS_KEY = 'dr:boardRepos';
let on = (() => { try { const saved = JSON.parse(localStorage.getItem(REPOS_KEY)); return Array.isArray(saved) ? saved : []; } catch { return []; } })();
const saveOn = () => { try { localStorage.setItem(REPOS_KEY, JSON.stringify(on)); } catch {} };
board.addEventListener('click', (e) => {
  const settings = e.target.closest('[data-settings]');
  if (settings) { SHELL?.settings(settings.dataset.settings); return; }
  if (e.target.closest('[data-update]')) { e.preventDefault(); update(); return; }
  const toggle = e.target.closest('[data-repo]');
  if (toggle) {
    const repo = toggle.dataset.repo;
    on = on.includes(repo) ? on.filter(r => r !== repo) : [...on, repo];
    saveOn();
    loadBoard(true);
    return;
  }
  const pill = e.target.closest('.card .reason');
  if (pill) pill.closest('.card').querySelector('.cover').click();
});
// A cached load draws the board from GitHub's last answer at once; the others ask GitHub again first, and the update
// notice at the end of the repository strip turns busy meanwhile. The board is stale until a load that asks
// GitHub draws it, so a cached load that ends while the board is stale asks GitHub next: a toggle click may have
// cancelled the load that asked. The redraw keeps the focus on the toggle or the list's button it had. Cmd+R or a click on the update
// link forces the update, which makes the board stale: the loads ask GitHub even when it answered a moment ago,
// until one of them ends. The update notice keeps its width while it is busy, so the strip keeps its lines.
let loading = null, stale = true, force = false;
const setUpdate = (html) => {
  const updated = board.querySelector('[data-updated]');
  if (!updated) return;
  updated.style.minWidth = `${updated.offsetWidth}px`;
  updated.innerHTML = html;
};
// The board's HTML, or an error that says why the server sent none: a plain text answer gives the reason.
const fetchBoard = async (query, signal) => {
  let r;
  try { r = await fetch(`/board?${query}`, { signal }); } catch (e) {
    throw signal.aborted ? e : new Error(`could not reach the server (${e.message})`);
  }
  if (r.ok) return r.text();
  throw new Error(r.headers.get('Content-Type')?.startsWith('text/plain') ? await r.text() : `HTTP ${r.status}`);
};
const loadBoard = (cached) => {
  if (loading) loading.abort();
  const { signal } = loading = new AbortController();
  const forced = !cached && force;
  const query = new URLSearchParams(on.map(repo => ['repo', repo]));
  if (cached) query.set('cached', '1');
  if (forced) query.set('force', '1');
  if (!cached) setUpdate(Notice.busy('Updating…'));
  fetchBoard(query, signal).then((h) => {
    const { repo, list } = document.activeElement?.dataset ?? {};
    redraw(h);
    if (repo) board.querySelector(`[data-repo="${CSS.escape(repo)}"]`)?.focus();
    if (list) board.querySelector(`.more[data-list="${CSS.escape(list)}"]:enabled`)?.focus();
    if (board.querySelector('.repos')) {
      on = [...board.querySelectorAll('[data-repo].on')].map(b => b.dataset.repo);
      saveOn();
    }
    if (!cached) stale = false;
  }).catch((e) => {
    if (!signal.aborted) setUpdate(Notice.failed('Update', e.message, 'data-update'));
  }).finally(() => {
    if (signal.aborted) return;
    if (forced) force = false;
    if (cached && stale) loadBoard();
  });
};
const update = () => {
  if (force) return;
  force = stale = true;
  loadBoard();
};
document.addEventListener('keydown', (e) => {
  if (e.metaKey && !e.altKey && !e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'r') { e.preventDefault(); update(); }
});
// The server drew the board with every row, so saved toggles first need a cached load.
loadBoard(on.length > 0);
document.addEventListener('tab-shown', () => loadBoard());
// Focus selects the whole field, so a pasted link replaces the old one. A click that focuses the field would put the
// caret where it lands on mouseup, so that one mouseup keeps the selection.
const pr = document.querySelector('input[name=pr]');
let clickFocus = false;
pr.addEventListener('mousedown', () => { clickFocus = document.activeElement !== pr; });
pr.addEventListener('mouseup', (e) => { if (clickFocus) e.preventDefault(); clickFocus = false; });
pr.addEventListener('focus', () => pr.select());
// The browser reads the field when the submit event ends, so the field empties after that.
pr.form.addEventListener('submit', () => setTimeout(() => { pr.value = ''; }));
</script>
